services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: emailhealth
      POSTGRES_USER: emailhealth
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U emailhealth -d emailhealth']
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  redis:
    image: redis:7.2-alpine
    command: [redis-server, --appendonly, 'yes']
    volumes: [redis72_data:/data]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  migrate:
    build: ./backend
    env_file: .env
    command: [sh, -c, 'alembic upgrade head && python -m app.bootstrap']
    depends_on:
      db: {condition: service_healthy}
  backend:
    build: ./backend
    env_file: .env
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
  worker:
    build: ./backend
    env_file: .env
    command: [celery, -A, app.worker.celery, worker, --loglevel=INFO, --concurrency=2]
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    healthcheck:
      test: [CMD-SHELL, 'celery -A app.worker.celery inspect ping -d celery@$$HOSTNAME --timeout=5']
      interval: 60s
      timeout: 15s
      retries: 3
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
  scheduler:
    build: ./backend
    env_file: .env
    command: [celery, -A, app.worker.celery, beat, --loglevel=INFO, --schedule=/tmp/celerybeat-schedule]
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -m, app.scheduler_health]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 90s
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
  frontend:
    build: ./frontend
    healthcheck:
      test: [CMD, wget, -q, --spider, 'http://127.0.0.1:8080/']
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped
  nginx:
    image: nginx:1.28-alpine
    ports: ['${HTTP_PORT:-80}:80']
    volumes: ['./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro']
    depends_on:
      backend: {condition: service_healthy}
      frontend: {condition: service_healthy}
    healthcheck:
      test: [CMD, wget, -q, --spider, 'http://127.0.0.1/api/health']
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped
volumes:
  postgres_data:
  redis72_data:
